<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movimientos · AgroApp</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body data-pagina="movimientos">
  <main>
    <div class="seccion-encabezado">
      <div>
        <h1>Movimientos de stock</h1>
        <p class="subtitulo" id="estado">Cargando…</p>
      </div>
      <div class="acciones">
        <button class="boton boton-secundario" type="button" id="boton-actualizar" data-icono="refrescar">Actualizar</button>
      </div>
    </div>

    <form class="filtros" id="filtros" role="search">
      <label class="buscador" data-icono-lupa>
        <input name="texto" type="search" placeholder="Buscar insumo o motivo…" aria-label="Buscar insumo o motivo" autocomplete="off">
      </label>
      <select name="insumo_id" aria-label="Insumo" id="filtro-insumo"></select>
      <select name="categoria" aria-label="Categoría" id="filtro-categoria"></select>
      <select name="tipo" aria-label="Tipo">
        <option value="">Entradas y salidas</option>
        <option value="entrada">Solo entradas</option>
        <option value="salida">Solo salidas</option>
      </select>
      <label class="campo-fecha" title="Desde"><input name="desde" type="date" aria-label="Desde"></label>
      <label class="campo-fecha" title="Hasta"><input name="hasta" type="date" aria-label="Hasta"></label>
      <button class="boton-limpiar" type="reset">Limpiar</button>
    </form>

    <!-- Totales: solo cuando se filtra UN insumo (sumar kg con litros no tiene sentido) -->
    <div class="resumen" id="totales" hidden></div>

    <div class="contenedor-tabla">
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Insumo</th>
            <th>Tipo</th>
            <th class="numero">Cantidad</th>
            <th>Motivo</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla"></tbody>
      </table>
    </div>
    <p class="ayuda" id="limite" hidden>Se muestran los últimos 500 movimientos. Usá los filtros para ver otros.</p>
  </main>

  <script src="comun.js"></script>
  <script src="movimientos.js"></script>
</body>
</html>
