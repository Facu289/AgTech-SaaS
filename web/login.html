<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · AgroApp</title>
  <script src="js/tema.js"></script>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<!-- Esta página NO carga comun.js: no tiene menú y no puede pedir datos (todavía no entraste). -->
<body class="pagina-login">
  <main class="login-caja">
    <div class="login-logo">
      <span class="logo-icono" id="logo-icono"></span>
      <span>AgroApp</span>
    </div>
    <form class="tarjeta" id="form-login">
      <h1>Entrar</h1>
      <label class="campo"><span>Usuario</span>
        <input name="usuario" required maxlength="50" autocomplete="username" autocapitalize="none" autofocus></label>
      <label class="campo"><span>Contraseña</span>
        <input name="contrasena" type="password" required autocomplete="current-password"></label>
      <p class="mensaje error" hidden></p>
      <button class="boton" type="submit">Entrar</button>
      <!-- Solo aparece si en el .env están GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET. -->
      <div class="login-google" id="login-google" hidden>
        <p class="separador"><span>o</span></p>
        <a class="boton boton-secundario boton-google" href="/auth/google/inicio">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.8 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.5 5.8c4.4-4 6.8-10 6.8-17.2z"/>
            <path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.8-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.8l7.8-6.1z"/>
            <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.8 6.1C6.6 42.6 14.6 48 24 48z"/>
          </svg>
          Entrar con Google
        </a>
      </div>
    </form>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
