<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vencimientos · AgroApp</title>
  <script src="js/tema.js"></script>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="vencimientos">
  <main>
    <div class="seccion-encabezado">
      <div>
        <h1>Vencimientos</h1>
        <p class="subtitulo" id="estado">Cargando…</p>
      </div>
      <div class="acciones">
        <button class="boton boton-secundario" type="button" id="boton-actualizar" data-icono="refrescar">Actualizar</button>
        <button class="boton" type="button" id="boton-nuevo" data-icono="mas">Nuevo vencimiento</button>
      </div>
    </div>

    <form class="filtros" id="filtros" role="search">
      <label class="buscador" data-icono-lupa>
        <input name="texto" type="search" placeholder="Buscar…" aria-label="Buscar" autocomplete="off">
      </label>
      <select name="estado" aria-label="Estado">
        <option value="">Pendientes</option>
        <option value="vencidos">Vencidos</option>
        <option value="proximos">Próximos 30 días</option>
        <option value="resueltos">Resueltos</option>
        <option value="todos">Todos</option>
      </select>
      <select name="tipo" aria-label="Tipo" data-tipos-vencimiento-filtro></select>
      <select name="maquina" aria-label="Máquina" data-maquinas-filtro></select>
      <button class="boton-limpiar" type="reset">Limpiar</button>
    </form>

    <div class="contenedor-tabla">
      <table>
        <thead>
          <tr><th>Vence</th><th>Descripción</th><th>Tipo</th><th>Máquina</th><th>Estado</th><th><span hidden>Acciones</span></th></tr>
        </thead>
        <tbody id="cuerpo-tabla"></tbody>
      </table>
    </div>
    <p class="ayuda">Desde Telegram: /vencimientos muestra los de los próximos 30 días.</p>
  </main>

  <!-- Ventana para crear / editar un vencimiento -->
  <dialog class="ventana" id="ventana-vencimiento" aria-labelledby="t-venc">
    <form method="dialog" id="form-vencimiento">
      <div class="tarjeta-titulo">
        <div class="icono-caja" data-icono="calendario"></div>
        <h2 id="t-venc">Nuevo vencimiento</h2>
      </div>
      <div class="campos" style="--columnas: 1fr 1fr">
        <label class="campo" style="grid-column: 1 / -1"><span>Descripción</span>
          <input name="descripcion" required maxlength="200" autocomplete="off" placeholder="Ej: Seguro del tractor, licencia de piloto de drone"></label>
        <label class="campo"><span>Tipo</span>
          <select name="tipo" required data-tipos-vencimiento></select></label>
        <label class="campo"><span>Vence el</span>
          <input name="fecha_vencimiento" type="date" required></label>
        <label class="campo"><span>Máquina (opcional)</span>
          <select name="maquina_id" data-maquinas></select></label>
        <label class="campo" style="grid-column: 1 / -1"><span>Observaciones</span>
          <textarea name="observaciones" maxlength="500" placeholder="Ej: póliza 123, aseguradora..."></textarea></label>
        <label class="casilla" data-solo-editar><input type="checkbox" name="resuelto"> Ya está renovado / resuelto</label>
      </div>
      <p class="mensaje" hidden></p>
      <div class="ventana-pie">
        <button class="boton boton-secundario" value="cancelar">Cancelar</button>
        <button class="boton" type="submit" data-icono="check">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="js/comun.js"></script>
  <script src="js/comun-maquinaria.js"></script>
  <script src="js/vencimientos.js"></script>
</body>
</html>
