<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio · AgroApp</title>
  <!-- Leaflet: el mapa de los lotes (ver lotes.html). -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="inicio">
  <main>
    <div class="seccion-encabezado">
      <div>
        <h1 id="saludo">Hola</h1>
        <p class="subtitulo" id="fecha-hoy"></p>
      </div>
      <div class="acciones">
        <a class="boton" href="orden.html" data-icono="orden">Nueva orden de trabajo</a>
      </div>
    </div>

    <!-- Números principales: cada uno lleva a su sección -->
    <div class="resumen" id="resumen"></div>

    <div class="inicio-principal">
      <!-- Mapa general: los lotes pintados por cultivo de la campaña -->
      <section class="tarjeta tarjeta-mapa" aria-labelledby="t-lotes">
        <div class="seccion-encabezado">
          <div class="tarjeta-titulo">
            <div class="icono-caja" data-icono="mapa"></div>
            <h2 id="t-lotes">Mapa general</h2>
            <span class="suave chico" id="campania-inicio"></span>
          </div>
          <a class="chico fuerte" href="lotes.html">Ver mapa completo</a>
        </div>
        <div id="mapa-inicio" class="mapa mapa-inicio" aria-label="Mapa de los lotes"></div>
        <div id="leyenda-inicio"></div>
      </section>

      <div class="columna-inicio">
        <!-- Accesos rápidos: lo que se hace todos los días, a un toque -->
        <section class="tarjeta" aria-labelledby="t-accesos">
          <div class="tarjeta-titulo">
            <div class="icono-caja" data-icono="flechas"></div>
            <h2 id="t-accesos">Accesos rápidos</h2>
          </div>
          <div class="accesos">
            <a class="acceso" href="orden.html" data-icono="orden" title="Nueva orden de trabajo">Nueva orden</a>
            <a class="acceso" href="quimicos.html#form-movimiento" data-icono="flechas" title="Entrada o salida de stock">Entrada / salida</a>
            <a class="acceso" href="lotes.html" data-icono="mapa" title="Dibujar un lote o importar un KMZ">Lote / KMZ</a>
            <a class="acceso" href="maquinas.html" data-icono="llave" title="Cargar horas o un service de una máquina">Horas / service</a>
            <a class="acceso" href="animales.html#form-evento" data-icono="vaca" title="Parto, tacto, sanidad...">Evento animal</a>
            <span class="acceso deshabilitado" data-icono="hoja" title="Se habilita cuando hagamos el módulo de actividades">Actividad <small>(pronto)</small></span>
          </div>
        </section>

        <!-- La orden de trabajo más reciente -->
        <section class="tarjeta" aria-labelledby="t-orden">
          <div class="seccion-encabezado">
            <div class="tarjeta-titulo">
              <div class="icono-caja" data-icono="orden"></div>
              <h2 id="t-orden">Última orden de trabajo</h2>
            </div>
            <a class="chico fuerte" href="ordenes.html">Ver todas</a>
          </div>
          <div id="ultima-orden"></div>
        </section>
      </div>
    </div>

    <div class="inicio-grilla">
      <!-- Lo último que se cargó en la app -->
      <section class="tarjeta" aria-labelledby="t-actividad">
        <div class="tarjeta-titulo">
          <div class="icono-caja" data-icono="historial"></div>
          <h2 id="t-actividad">Última actividad</h2>
        </div>
        <ul class="lista-atencion" id="ultima-actividad"></ul>
      </section>

      <!-- Lo que requiere atención -->
      <section class="tarjeta" aria-labelledby="t-atencion">
        <div class="seccion-encabezado">
          <div class="tarjeta-titulo">
            <div class="icono-caja" data-icono="alerta"></div>
            <h2 id="t-atencion">Requiere atención</h2>
          </div>
          <span class="suave chico" id="estado">Cargando…</span>
        </div>
        <ul class="lista-atencion compacta" id="lista-atencion"></ul>
      </section>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
  <script src="js/comun.js"></script>
  <script src="js/comun-lotes.js"></script>
  <script src="js/inicio.js"></script>
</body>
</html>
