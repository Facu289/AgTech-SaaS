<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animales · AgroApp</title>
  <script src="js/tema.js"></script>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="animales">
  <main>
    <div class="alertas" id="alertas"></div>

    <div class="resumen" id="resumen"></div>

    <section class="tarjeta" aria-labelledby="t-evento">
      <div class="tarjeta-titulo">
        <div class="icono-caja" data-icono="historial"></div>
        <h2 id="t-evento">Registrar evento</h2>
      </div>
      <form id="form-evento">
        <div class="campos">
          <label class="campo"><span>Caravana</span>
            <input name="caravana" required list="lista-caravanas" autocomplete="off" placeholder="Ej: 1234"></label>
          <label class="campo"><span>Especie</span>
            <select name="especie_id" aria-describedby="ayuda-especie-evento"></select></label>
          <label class="campo"><span>Evento</span>
            <select name="tipo" required data-tipos-evento></select></label>
          <label class="campo"><span>Fecha</span>
            <input name="fecha" type="date" required></label>
          <label class="campo" data-solo-evento="parto"><span>Crías machos</span>
            <input name="crias_machos" type="number" min="0" max="20" value="0"></label>
          <label class="campo" data-solo-evento="parto"><span>Crías hembras</span>
            <input name="crias_hembras" type="number" min="0" max="20" value="0"></label>
          <label class="campo" data-solo-evento="tacto"><span>Resultado</span>
            <select name="resultado">
              <option value="prenada">Preñada</option>
              <option value="vacia">Vacía</option>
            </select></label>
          <label class="campo" data-solo-evento="tacto"><span>Parto probable (opcional)</span>
            <input name="fecha_probable_parto" type="date"></label>
          <label class="campo"><span>Detalle</span>
            <input name="detalle" maxlength="500" autocomplete="off" placeholder="Ej: toro 55, vacuna aftosa…"></label>
          <button class="boton" type="submit" data-icono="check">Registrar</button>
        </div>
        <p class="ayuda" id="ayuda-evento"></p>
        <p class="ayuda" id="ayuda-especie-evento">La especie hace falta solo si esa caravana se repite.</p>
        <p class="mensaje" hidden></p>
      </form>
    </section>

    <section aria-labelledby="t-rodeo" style="display:flex;flex-direction:column;gap:16px;margin-top:12px">
      <div class="seccion-encabezado">
        <div>
          <h2 id="t-rodeo">Animales</h2>
          <p class="subtitulo" id="estado">Cargando…</p>
        </div>
        <div class="acciones">
          <button class="boton boton-secundario" type="button" id="boton-actualizar" data-icono="refrescar">Actualizar</button>
          <button class="boton" type="button" id="boton-nuevo" data-icono="mas">Nuevo animal</button>
        </div>
      </div>

      <form class="filtros" id="filtros" role="search">
        <label class="buscador" data-icono-lupa>
          <input name="texto" type="search" placeholder="Buscar caravana, grupo, raza u observación…" aria-label="Buscar" autocomplete="off">
        </label>
        <select name="especie" aria-label="Especie" data-especies-filtro></select>
        <select name="categoria" aria-label="Categoría" data-categorias-filtro></select>
        <select name="reproductivo" aria-label="Estado reproductivo">
          <option value="">Todos los estados</option>
          <option value="prenada">Preñadas</option>
          <option value="vacia">Vacías</option>
          <option value="sin_dato">Hembras sin dato</option>
          <option value="parto_proximo">Parto en 30 días</option>
        </select>
        <select name="rodeo" aria-label="Rodeo" data-rodeos-filtro></select>
        <label class="casilla"><input type="checkbox" name="bajas"> Ver bajas</label>
        <button class="boton-limpiar" type="reset">Limpiar</button>
      </form>

      <div class="contenedor-tabla">
        <table>
          <thead>
            <tr>
              <th>Caravana / grupo</th><th>Especie</th><th>Categoría</th><th>Raza</th><th>Rodeo</th><th>Estado</th>
              <th>Parto probable</th><th class="numero">Partos</th><th><span hidden>Acciones</span></th>
            </tr>
          </thead>
          <tbody id="cuerpo-tabla"></tbody>
        </table>
      </div>
    </section>
  </main>

  <datalist id="lista-caravanas"></datalist>
  <!-- Ventana para crear / editar un animal -->
  <dialog class="ventana" id="ventana-animal" aria-labelledby="t-animal">
    <form method="dialog" id="form-animal">
      <div class="tarjeta-titulo">
        <div class="icono-caja" data-icono="vaca"></div>
        <h2 id="t-animal">Nuevo animal</h2>
      </div>
      <div class="campos" style="--columnas: 1fr 1fr 1fr">
        <label class="campo"><span>Especie</span>
          <select name="especie_id" required></select></label>
        <label class="campo"><span>Categoría</span>
          <select name="categoria_id" required></select></label>
        <label class="casilla" style="align-self:end"><input type="checkbox" name="es_grupo"> Es un grupo de animales</label>
        <label class="campo"><span data-texto-caravana>Caravana</span>
          <input name="caravana" required maxlength="60" autocomplete="off" placeholder="Ej: 1234 o Galpón 1"></label>
        <label class="campo" data-solo-grupo><span>Cantidad de animales</span>
          <input name="cantidad" type="number" min="0" step="1" value="1"></label>
        <label class="campo"><span>Raza</span>
          <input name="raza" maxlength="60" list="lista-razas" autocomplete="off" placeholder="Ej: Angus, Merino, Duroc"></label>
        <label class="campo"><span>Rodeo / potrero</span>
          <input name="rodeo" maxlength="60" list="lista-rodeos" autocomplete="off" placeholder="Ej: Norte"></label>
        <label class="campo" data-solo-individual><span>Fecha de nacimiento</span>
          <input name="fecha_nacimiento" type="date"></label>
        <label class="campo" data-solo-individual><span>Madre</span>
          <select name="madre_id" data-madres></select></label>
        <label class="campo" data-solo-hembra><span>Estado reproductivo</span>
          <select name="estado_reproductivo" data-estados-reproductivos></select></label>
        <label class="campo" data-solo-prenada><span>Parto probable</span>
          <input name="fecha_probable_parto" type="date"></label>
        <label class="campo"><span>Situación</span>
          <select name="estado" data-estados-animal></select></label>
        <label class="campo" style="grid-column: 1 / -1"><span>Observaciones</span>
          <textarea name="observaciones" maxlength="1000"></textarea></label>
      </div>
      <p class="mensaje" hidden></p>
      <div class="ventana-pie">
        <button class="boton boton-secundario" value="cancelar">Cancelar</button>
        <button class="boton" type="submit" data-icono="check">Guardar</button>
      </div>
    </form>
  </dialog>

  <datalist id="lista-razas">
    <option value="Angus"></option><option value="Aberdeen Angus colorado"></option><option value="Hereford"></option>
    <option value="Braford"></option><option value="Brangus"></option><option value="Holando"></option>
    <option value="Jersey"></option><option value="Shorthorn"></option><option value="Limousin"></option>
    <option value="Cruza"></option>
  </datalist>
  <datalist id="lista-rodeos"></datalist>

  <script src="js/comun.js"></script>
  <script src="js/comun-ganaderia.js"></script>
  <script src="js/animales.js"></script>
</body>
</html>
